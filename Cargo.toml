[workspace]
resolver = "2"
members = [
    "crates/argus-common",
    "crates/argus-agent",
    "crates/argus-collector",
    "crates/argus-analyzer",
    "crates/argus-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Cycorld <security@entropyparadox.com>"]
license = "Apache-2.0"
repository = "https://github.com/entropyparadox-lab/argus-audit"
description = "Zero-overhead Linux Dev & AI Activity Audit Engine in Rust"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
nix = { version = "0.29", features = ["process", "signal", "user", "term", "fs", "poll", "hostname"] }
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
axum = { version = "0.7", features = ["tokio", "http2"] }
futures = "0.3"
bytes = "1.6"
tempfile = "3.10"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"

# Internal crates
argus-common = { path = "crates/argus-common" }
argus-agent = { path = "crates/argus-agent" }
argus-collector = { path = "crates/argus-collector" }
argus-analyzer = { path = "crates/argus-analyzer" }
